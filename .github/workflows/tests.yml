name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  core-tests:
    name: IrisEyeGlanceCore (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run package tests
        working-directory: Packages/IrisEyeGlanceCore
        run: swift test

  app-build:
    name: iOS app (unsigned build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for a generic iOS device
        run: |
          xcodebuild -project IrisEyeGlance.xcodeproj -scheme IrisEyeGlance \
            -destination 'generic/platform=iOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
